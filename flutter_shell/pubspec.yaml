name: mgcs_frontend
description: "Replaceable Flutter shell for the M-GCS ground station."
publish_to: 'none'
version: 0.0.6+6

environment:
  sdk: ^3.12.2

dependencies:
  cupertino_icons: ^1.0.9
  ffi: ^2.1.4
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  macos_ui: ^2.2.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_32.png
