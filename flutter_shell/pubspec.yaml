name: mgcs_frontend
description: "Replaceable Flutter shell for the M-GCS ground station."
publish_to: 'none'
version: 0.0.26+26

environment:
  sdk: ^3.12.2

dependencies:
  cupertino_icons: ^1.0.9
  ffi: ^2.1.4
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  macos_ui: ^2.2.2
  # 地图偏好（上次选的地图源、缩放、中心点）需要落到应用支持目录。
  # path_provider 是 Flutter 官方插件，BSD-3-Clause，macOS/Windows/Linux 都支持。
  path_provider: ^2.1.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_32.png
    # 随包分发字体许可原文：MiSans 许可要求署名，OFL 类许可要求附许可副本。
    - assets/fonts/MiSans-LICENSE.txt
  fonts:
    # 中英文统一字体：MiSans 同时覆盖汉字与拉丁，全应用只用这一套。
    # 许可见 assets/fonts/MiSans-LICENSE.txt：免费商用，但要求在软件中注明、
    # 不得修改字体、不得单独再分发，且授权可撤销。
    - family: MiSans
      fonts:
        - asset: assets/fonts/MiSans-Regular.otf
          weight: 400
        - asset: assets/fonts/MiSans-Semibold.otf
          weight: 600
        - asset: assets/fonts/MiSans-Bold.otf
          weight: 700
