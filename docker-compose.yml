services:
  mgcore-dev:
    platform: linux/amd64
    build:
      context: .
    image: mgcore-dev:local
    working_dir: /workspace
    volumes:
      - .:/workspace
      - mgcore-pip-cache:/root/.cache/pip
      - mgcore-python-venv:/opt/mgcore-venv
      - mgcore-mavlink-headers:/opt/mgcore-mavlink
    environment:
      MGCORE_BUILD_DIR: /workspace/build_docker
    stdin_open: true
    tty: true

volumes:
  mgcore-pip-cache:
  mgcore-python-venv:
  mgcore-mavlink-headers:
