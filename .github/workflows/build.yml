name: 构建与测试

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release]

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: 安装 MAVLink 生成工具
      shell: bash
      run: PYTHON_BIN=python ./tools/generate-mavlink.sh

    - name: 配置 CMake
      run: cmake -B build -DMGCORE_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

    - name: 构建
      run: cmake --build build --config ${{ matrix.build_type }}

    - name: 运行离线与模拟测试
      working-directory: build
      run: ctest --output-on-failure -L "offline|simulation" -LE "hardware|manual"

  flutter:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.44.7'
        channel: stable
        cache: true

    - name: 获取 Flutter 依赖
      working-directory: app
      run: flutter --no-version-check pub get

    - name: Flutter 静态分析
      working-directory: app
      run: flutter --no-version-check analyze

    - name: Flutter 测试
      working-directory: app
      run: flutter --no-version-check test
