name: 构建与测试

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Release]

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: 生成 MAVLink C 头
      shell: bash
      run: PYTHON_BIN=python ./tools/generate-mavlink.sh

    - name: 配置 CMake
      run: cmake -B build -DMGCORE_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

    - name: 构建
      run: cmake --build build --config ${{ matrix.build_type }} --parallel

    - name: 运行离线与模拟测试
      working-directory: build
      run: ctest --output-on-failure --no-tests=error -C ${{ matrix.build_type }} -L "offline|simulation" -LE "hardware|manual"

  flutter-shell:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_shell

    steps:
    - uses: actions/checkout@v4

    - uses: subosito/flutter-action@v2
      with:
        channel: stable

    - name: 获取依赖
      run: flutter pub get

    - name: 检查 UI 设计 token
      run: dart ../tools/check_ui_tokens.dart

    - name: 静态分析
      run: flutter analyze

    - name: 运行外壳测试
      run: flutter test

  windows-shell:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: flutter_shell

    steps:
    - uses: actions/checkout@v4

    - uses: subosito/flutter-action@v2
      with:
        channel: stable

    - name: 获取依赖
      run: flutter pub get

    - name: 检查 UI 设计 token
      run: dart ../tools/check_ui_tokens.dart

    - name: 静态分析
      run: flutter analyze

    - name: 运行外壳测试
      run: flutter test

    - name: 构建 Windows debug 应用
      run: flutter build windows --debug

    - name: 检查 Windows 后端桥接产物
      run: dart ../tools/check_windows_bundle.dart build/windows/x64/runner/Debug

    - name: 上传 Windows 构建产物
      uses: actions/upload-artifact@v4
      with:
        name: mgcs-windows-debug
        path: flutter_shell/build/windows/x64/runner/Debug
